name: validate-fixtures

# Machine-enforced gate: every push and PR runs the plugin's own test suite
# (static fixtures + generated mutations + schema↔validator consistency + self-test
# canaries). A broken/fail-open validator, a schema↔validator drift, or a regressed
# checker turns this red and blocks merge — independent of who made the change.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # Zero-dependency Node CLIs — no install step needed.
      - name: Run fixture / mutation / consistency suite
        run: node scripts/validate-fixtures.cjs
      # ubuntu-latest ships jq — no install step needed.
      - name: Run session-reflect gate tests
        run: bash plugins/session-reflect/tests/gate.test.sh
      - name: Run session-reflect friction-digest tests
        run: bash plugins/session-reflect/tests/digest.test.sh
      - name: Run session-learning reminder tests
        run: bash plugins/session-learning/tests/reminder.test.sh
      - name: Run openspec-superpowers-workflow skip-gate tests
        run: bash plugins/openspec-superpowers-workflow/tests/skip-gate.test.sh
      - name: Run scope-ledger hook tests
        run: bash plugins/scope-ledger/tests/scope-hooks.test.sh
      - name: Run scope-ledger stats tests
        run: bash plugins/scope-ledger/tests/scope-stats.test.sh
      - name: Run security-audit vendored upstream validator tests
        run: bash plugins/security-audit/tests/upstream.test.sh
      - name: Run code-audit-rigor review-branch-rounds / resolve-rules tests
        run: bash plugins/code-audit-rigor/tests/review-branch-rounds.test.sh
      - name: Run validate-on-plugin-edit hook tests
        run: bash scripts/hooks/validate-on-plugin-edit.test.sh
