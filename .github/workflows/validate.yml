name: validate-fixtures

# Machine-enforced gate: every push and PR runs the plugin's own test suite
# (static fixtures + generated mutations + schema↔validator consistency + self-test
# canaries). A broken/fail-open validator, a schema↔validator drift, or a regressed
# checker turns this red and blocks merge — independent of who made the change.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      # Zero-dependency Node CLIs — no install step needed.
      - name: Run fixture / mutation / consistency suite
        run: node scripts/validate-fixtures.cjs
      # ubuntu-latest ships jq — no install step needed.
      # Same enumeration as the local PostToolUse hook (scripts/hooks/validate-on-plugin-edit.cjs):
      # every plugins/*/tests/*.test.sh, so a new suite cannot run locally yet be missing here.
      # Every suite runs even after one fails; the step fails if any did, or if none were found.
      - name: Run every plugin test suite (plugins/*/tests/*.test.sh)
        run: |
          # dotglob: the hook lists with readdirSync, which includes dot-named entries
          shopt -s nullglob dotglob
          suites=(plugins/*/tests/*.test.sh)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::no plugin test suites found under plugins/*/tests/"
            exit 1
          fi
          echo "found ${#suites[@]} suites"
          rc=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            bash "$suite" || { echo "::error file=$suite::suite failed"; rc=1; }
            echo "::endgroup::"
          done
          exit "$rc"
      - name: Run validate-on-plugin-edit hook tests
        run: bash scripts/hooks/validate-on-plugin-edit.test.sh
